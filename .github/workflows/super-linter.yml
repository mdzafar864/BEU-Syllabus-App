name: Super-Linter - BEU Syllabus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: beu-super-linter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pull requests are checked with read-only access. No commits are pushed to PRs.
jobs:
  lint-pull-request:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-Linter (check only)
        uses: super-linter/super-linter@v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          LINTER_RULES_PATH: .github/linters
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_XML: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_NATURAL_LANGUAGE: false

  auto-fix-main:
    name: Auto-fix and commit on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Super-Linter (auto-fix)
        uses: super-linter/super-linter@v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          LINTER_RULES_PATH: .github/linters
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs

          # HTML formatting
          FIX_HTML_PRETTIER: true

          # CSS lint fixes and formatting
          FIX_CSS: true
          FIX_CSS_PRETTIER: true

          # JavaScript ESLint fixes and formatting
          FIX_JAVASCRIPT_ES: true
          FIX_JAVASCRIPT_PRETTIER: true

          # Validate supporting project files
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_XML: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_NATURAL_LANGUAGE: false

      - name: Commit and push auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: apply Super-Linter auto-fixes"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          file_pattern: "*.html *.css *.js *.json *.md *.yml *.yaml *.xml"
